<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>环管截面二维归一化投影工具</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #efe6d9; }
    #app { display: block; width: 100%; height: 100%; border: 0; background: #efe6d9; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 15px "Microsoft YaHei", "Segoe UI", sans-serif; color: #30444f; background: #efe6d9; }
    #loading.error { color: #a3332a; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="loading">正在载入环管截面投影工具…</div>
  <iframe id="app" title="环管截面二维归一化投影工具" hidden></iframe>

  <script id="wide-export-patch" type="text/plain">
(() => {
  if (window.__wideSectionExportPatched) return;
  window.__wideSectionExportPatched = true;

  const exportMode = document.getElementById("exportMode");
  const exportCard = document.querySelector(".export-card");
  if (!exportMode || !exportCard) throw new Error("未找到导出设置区域");

  let sectionLayout = document.getElementById("sectionLayout");
  if (!sectionLayout) {
    const label = document.createElement("label");
    label.innerHTML = '多截面排列方式<select id="sectionLayout"><option value="wide" selected>横向并列（推荐）</option><option value="long">纵向追加（兼容旧格式）</option></select>';
    exportMode.closest("label").insertAdjacentElement("afterend", label);
    sectionLayout = label.querySelector("select");
  }
  els.sectionLayout = sectionLayout;

  const style = document.createElement("style");
  style.textContent = `
    .data-table-wide thead tr:first-child th { top: 0; z-index: 4; }
    .data-table-wide thead tr:nth-child(2) th { top: 36px; z-index: 3; }
    .section-group-head {
      height: 36px;
      text-align: center;
      color: var(--accent-dark);
      background: #e8f7f8;
      border-left: 2px solid #9ed4dc;
      border-right: 2px solid #9ed4dc;
      font-weight: 700;
    }
    .section-field-head { background: #f6fbfc; }
    .section-gap {
      min-width: 18px;
      width: 18px;
      padding: 0 !important;
      border: 0 !important;
      background: var(--bg) !important;
    }
  `;
  document.head.appendChild(style);

  const originalRenderPreview = renderPreview;
  const originalBuildCsvText = buildCsvText;

  function useWideLayout() {
    return sectionLayout.value === "wide" && state.groups.length > 1;
  }

  function blockHeaders() {
    const excluded = new Set([els.groupCol.value, "section_id_projected"].filter(Boolean));
    return exportHeaders().filter(header => !excluded.has(header));
  }

  function groupedRows() {
    return state.groups.map(group => ({
      group,
      rows: state.projected.filter(row => String(row.section_id_projected) === String(group)),
    }));
  }

  function renderWidePreview() {
    const headers = blockHeaders();
    const groups = groupedRows();
    if (!headers.length || groups.length < 2) {
      originalRenderPreview(state.projected.slice(0, 30), exportHeaders());
      return;
    }

    const maxRows = Math.min(30, Math.max(...groups.map(item => item.rows.length)));
    const groupHeader = groups.map((item, index) => {
      const gap = index < groups.length - 1 ? '<th class="section-gap" rowspan="2"></th>' : '';
      return `<th class="section-group-head" colspan="${headers.length}">${escapeHtml(item.group)}</th>${gap}`;
    }).join("");

    const fieldHeader = groups.map(item => headers.map(header =>
      `<th class="section-field-head" title="${escapeHtml(item.group)}">${escapeHtml(header)}</th>`
    ).join("")).join("");

    const body = Array.from({ length: maxRows }, (_, rowIndex) => {
      const cells = groups.map((item, index) => {
        const row = item.rows[rowIndex];
        const values = headers.map(header => `<td>${row ? escapeHtml(formatCell(row[header])) : ""}</td>`).join("");
        const gap = index < groups.length - 1 ? '<td class="section-gap"></td>' : '';
        return values + gap;
      }).join("");
      return `<tr>${cells}</tr>`;
    }).join("");

    els.preview.innerHTML = `<table class="data-table data-table-wide"><thead><tr>${groupHeader}</tr><tr>${fieldHeader}</tr></thead><tbody>${body}</tbody></table>`;
    queueLayoutSync();
  }

  renderPreview = function(rows, headers) {
    if (state.projected.length && useWideLayout()) {
      renderWidePreview();
      return;
    }
    originalRenderPreview(rows, headers);
  };

  function buildWideCsvText() {
    const headers = blockHeaders();
    const groups = groupedRows();
    if (!headers.length || groups.length < 2) return originalBuildCsvText();

    const sectionRow = [];
    const headerRow = [];
    groups.forEach((item, index) => {
      sectionRow.push(item.group, ...Array(Math.max(0, headers.length - 1)).fill(""));
      headerRow.push(...headers);
      if (index < groups.length - 1) {
        sectionRow.push("");
        headerRow.push("");
      }
    });

    const lines = [
      sectionRow.map(csvEscape).join(","),
      headerRow.map(csvEscape).join(","),
    ];

    const maxRows = Math.max(...groups.map(item => item.rows.length));
    for (let rowIndex = 0; rowIndex < maxRows; rowIndex++) {
      const output = [];
      groups.forEach((item, index) => {
        const row = item.rows[rowIndex];
        headers.forEach(header => output.push(row ? row[header] : ""));
        if (index < groups.length - 1) output.push("");
      });
      lines.push(output.map(csvEscape).join(","));
    }
    return "\uFEFF" + lines.join("\n");
  }

  buildCsvText = function() {
    return useWideLayout() ? buildWideCsvText() : originalBuildCsvText();
  };

  sectionLayout.addEventListener("change", () => {
    if (state.projected.length) renderPreview(state.projected.slice(0, 30), exportHeaders());
  });
})();
  </script>

  <script>
    const frame = document.getElementById("app");
    const loading = document.getElementById("loading");
    const legacySource = "https://raw.githubusercontent.com/ttmmss278-png/cfx-plane-wizard/a0b7e05c7cd601c3b251e7a3cc2eb80511309f63/docs/normalize-section/index.html";

    fetch(legacySource, { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`载入原页面失败：HTTP ${response.status}`);
        return response.text();
      })
      .then(html => {
        frame.addEventListener("load", () => {
          try {
            const doc = frame.contentDocument;
            const patch = doc.createElement("script");
            patch.textContent = document.getElementById("wide-export-patch").textContent;
            doc.body.appendChild(patch);
            frame.hidden = false;
            loading.remove();
          } catch (error) {
            loading.className = "error";
            loading.textContent = `页面功能注入失败：${error.message}`;
          }
        }, { once: true });
        frame.srcdoc = html;
      })
      .catch(error => {
        loading.className = "error";
        loading.textContent = `页面载入失败：${error.message}`;
      });
  </script>
</body>
</html>
