name: Register mesh independence module

on:
  push:
    paths:
      - .github/workflows/register-mesh-independence.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register module 07 without touching existing modules
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("src/App.tsx")
          text = app_path.read_text(encoding="utf-8")

          if 'id: "mesh-independence"' not in text:
              marker = '''    features: ["CEL / CCL", "文件夹管理", "GitHub 同步"],
            },
          ];'''
              if marker not in text:
                  raise SystemExit("Could not find module registry insertion marker")
              replacement = '''    features: ["CEL / CCL", "文件夹管理", "GitHub 同步"],
            },
            {
              id: "mesh-independence",
              sequence: "07",
              title: "网格无关性验证",
              shortTitle: "网格无关性",
              description: "基于三组粗、中、细网格结果进行网格收敛检查，并为后续 GCI / Richardson 外推与网格选取提供统一工作区。",
              category: "数值验证",
              runtime: "browser",
              runtimeLabel: "纯浏览器",
              entry: "modules/mesh-independence/index.html",
              icon: Boxes,
              tone: "violet",
              features: ["GCI / Richardson", "收敛分析", "网格推荐"],
            },
          ];'''
              text = text.replace(marker, replacement, 1)

          old_guard = 'if (module.id !== "cfx-post-library") {'
          new_guard = 'if (!["cfx-post-library", "mesh-independence"].includes(module.id)) {'
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)

          app_path.write_text(text, encoding="utf-8")

          css_path = Path("public/modules/mesh-independence/styles.css")
          css = css_path.read_text(encoding="utf-8")
          compat = '''

          /* Embedded compatibility: keep the module background on the active Pelton skin. */
          html[data-pelton-embedded="true"] body.mi-module-page,
          body.mi-module-page.toolbox-embedded {
            background: var(--mi-bg) !important;
          }
          '''
          if 'Embedded compatibility: keep the module background' not in css:
              css_path.write_text(css.rstrip() + compat, encoding="utf-8")

          workflow = Path(".github/workflows/register-mesh-independence.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Verify TypeScript and build
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx public/modules/mesh-independence/styles.css .github/workflows/register-mesh-independence.yml
          git commit -m "Register mesh independence module 07"
          git push origin HEAD:main
