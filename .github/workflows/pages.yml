name: Deploy engineering toolbox to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/unified-engineering-toolbox
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-local-service:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Windows local service package
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\build-local-service-package.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\scripts\verify-local-service-package.ps1"
          exit $LASTEXITCODE

      - name: Upload verified local service package
        uses: actions/upload-artifact@v4
        with:
          name: windows-local-service
          path: |
            public/downloads/Pelton-Toolbox-Local-Service-Windows.zip
            public/downloads/local-service-manifest.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: verify-local-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified local service package
        uses: actions/download-artifact@v4
        with:
          name: windows-local-service
          path: public/downloads

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
