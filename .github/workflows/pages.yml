name: Deploy engineering toolbox to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/unified-engineering-toolbox
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build with diagnostics
        id: diagnostic
        shell: bash
        run: |
          set +e
          LOG_FILE=.github/pages-build-diagnostic.log
          : > "$LOG_FILE"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo
            echo "===== npm ci ====="
            npm ci
            INSTALL_STATUS=$?
            echo
            echo "npm ci exit code: $INSTALL_STATUS"
            BUILD_STATUS=99
            if [ "$INSTALL_STATUS" -eq 0 ]; then
              echo
              echo "===== npm run build ====="
              npm run build
              BUILD_STATUS=$?
              echo
              echo "npm run build exit code: $BUILD_STATUS"
            fi
            echo
            echo "INSTALL_STATUS=$INSTALL_STATUS"
            echo "BUILD_STATUS=$BUILD_STATUS"
          } 2>&1 | tee "$LOG_FILE"

          INSTALL_STATUS=$(grep '^INSTALL_STATUS=' "$LOG_FILE" | tail -1 | cut -d= -f2)
          BUILD_STATUS=$(grep '^BUILD_STATUS=' "$LOG_FILE" | tail -1 | cut -d= -f2)
          echo "install_status=${INSTALL_STATUS:-98}" >> "$GITHUB_OUTPUT"
          echo "build_status=${BUILD_STATUS:-98}" >> "$GITHUB_OUTPUT"

      - name: Save diagnostic log
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-build-diagnostic.log
          git commit -m "chore: save Pages build diagnostics [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Stop after failed build
        if: ${{ steps.diagnostic.outputs.install_status != '0' || steps.diagnostic.outputs.build_status != '0' }}
        run: exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
