name: One-time preserve edits during GitHub sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-sync-concurrent-edits-once.yml

permissions:
  contents: write

jobs:
  patch-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch concurrent edit handling
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          path = Path('public/modules/cfx-post-library/sync-hardening.js')
          text = path.read_text(encoding='utf-8')

          old = """  state.github.syncLog=Array.isArray(state.github.syncLog)?state.github.syncLog:[];
  state.github.syncPaused=!!state.github.syncPaused;
  state.github.queueDepth=0;

  function syncLog(event,details={}){"""
          new = """  state.github.syncLog=Array.isArray(state.github.syncLog)?state.github.syncLog:[];
  state.github.syncPaused=!!state.github.syncPaused;
  state.github.queueDepth=0;
  state.github.localRevision=Number(state.github.localRevision)||0;
  state.github.syncPending=!!state.github.syncPending;

  function syncLog(event,details={}){"""
          if text.count(old) != 1:
              raise RuntimeError('Unable to insert local revision state')
          text = text.replace(old, new)

          old = """  canonicalDatabase=function(data){return canonicalDatabaseFull(data);};
  databaseEqual=function(a,b){return JSON.stringify(semanticDatabase(a))===JSON.stringify(semanticDatabase(b));};
  makeDatabasePayload=function(){return {app:'CFX-Post Formula and Command Library',version:7,appVersion:SYNC_HARDENING_VERSION,exportedAt:now(),defaultCategory:'未分类',categories:state.categories,folders:state.folders,items:state.items};};
  recomputeGithubDirty=function(){if(!state.github.ready||state.github.suspendDirty)return;state.github.dirty=state.github.basePayload?!databaseEqual(makeDatabasePayload(),state.github.basePayload):false;updateGithubUi();};
  markGithubDirty=function(){if(!state.github.ready||state.github.suspendDirty)return;state.github.dirty=state.github.basePayload?!databaseEqual(makeDatabasePayload(),state.github.basePayload):true;updateGithubUi();if(state.github.dirty)scheduleGithubAutoPush();};

  function timeValue(value){"""
          new = """  canonicalDatabase=function(data){return canonicalDatabaseFull(data);};
  databaseEqual=function(a,b){return JSON.stringify(semanticDatabase(a))===JSON.stringify(semanticDatabase(b));};
  makeDatabasePayload=function(){return {app:'CFX-Post Formula and Command Library',version:7,appVersion:SYNC_HARDENING_VERSION,exportedAt:now(),defaultCategory:'未分类',categories:state.categories,folders:state.folders,items:state.items};};
  recomputeGithubDirty=function(){if(!state.github.ready||state.github.suspendDirty)return;state.github.dirty=state.github.basePayload?!databaseEqual(makeDatabasePayload(),state.github.basePayload):false;updateGithubUi();};
  markGithubDirty=function(){if(!state.github.ready||state.github.suspendDirty)return;state.github.dirty=state.github.basePayload?!databaseEqual(makeDatabasePayload(),state.github.basePayload):true;updateGithubUi();if(state.github.dirty)scheduleGithubAutoPush();};

  function noteLocalMutation(source){
    state.github.localRevision=(Number(state.github.localRevision)||0)+1;
    if(state.github.busy||queueRunning)state.github.syncPending=true;
    syncLog('local-change',{source,revision:state.github.localRevision,pending:state.github.syncPending});
  }
  const previousSave=save,previousSaveCategories=saveCategories,previousSaveFolders=saveFolders;
  save=function(markCloudDirty=true){if(markCloudDirty)noteLocalMutation('database');return previousSave(markCloudDirty);};
  saveCategories=function(markCloudDirty=true){const result=previousSaveCategories();if(markCloudDirty){noteLocalMutation('categories');markGithubDirty();}return result;};
  saveFolders=function(markCloudDirty=true){const result=previousSaveFolders();if(markCloudDirty){noteLocalMutation('folders');markGithubDirty();}return result;};

  function timeValue(value){"""
          if text.count(old) != 1:
              raise RuntimeError('Unable to wrap save functions')
          text = text.replace(old, new)

          old = """  completeGithubPush=async function(body,payloadOverride=null){
    const payload=payloadOverride||makeDatabasePayload();
    await finalizeSuccessfulSync(payload,body.content?.sha||state.github.remoteSha||'',{pushed:true});
  };"""
          new = """  async function finalizePushResult(payload,sha,revisionAtPayload){
    if((Number(state.github.localRevision)||0)===revisionAtPayload){
      state.github.syncPending=false;
      await finalizeSuccessfulSync(payload,sha,{pushed:true});
      return;
    }
    setGithubBase(payload);
    state.github.connected=true;
    state.github.remoteSha=sha||state.github.remoteSha||'';
    state.github.remoteEtag='';
    state.github.lastSyncAt=now();
    state.github.lastPushAt=now();
    state.github.lastCheckAt=now();
    clearGithubConflict();
    recomputeGithubDirty();
    state.github.syncPending=state.github.dirty;
    saveGithubConfig();
    updateGithubUi();
    syncLog('concurrent-edit-preserved',{uploadedRevision:revisionAtPayload,currentRevision:state.github.localRevision,dirty:state.github.dirty});
    if(state.github.dirty&&state.github.autoSync)scheduleGithubAutoPush();
  }

  completeGithubPush=async function(body,payloadOverride=null,revisionAtPayload=Number(state.github.localRevision)||0){
    const payload=payloadOverride||makeDatabasePayload();
    await finalizePushResult(payload,body.content?.sha||state.github.remoteSha||'',revisionAtPayload);
  };"""
          if text.count(old) != 1:
              raise RuntimeError('Unable to replace push finalizer')
          text = text.replace(old, new)

          old = """      const payload={...prepared.payload,exportedAt:now(),appVersion:SYNC_HARDENING_VERSION};
      syncLog('push-attempt',{attempt,automatic,remoteSha:prepared.file?.sha||'',hash:databaseHash(payload),items:payload.items.length,folders:payload.folders.length});
      try{
        const body=await writeGithubPayload(cfg,prepared.file,message,payload);
        await completeGithubPush(body,payload);"""
          new = """      const payload={...prepared.payload,exportedAt:now(),appVersion:SYNC_HARDENING_VERSION};
      const revisionAtPayload=Number(state.github.localRevision)||0;
      syncLog('push-attempt',{attempt,automatic,remoteSha:prepared.file?.sha||'',hash:databaseHash(payload),items:payload.items.length,folders:payload.folders.length,revision:revisionAtPayload});
      try{
        const body=await writeGithubPayload(cfg,prepared.file,message,payload);
        await completeGithubPush(body,payload,revisionAtPayload);"""
          if text.count(old) != 1:
              raise RuntimeError('Unable to capture payload revision')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PYCODE

          node --check public/modules/cfx-post-library/sync-hardening.js
          grep -q 'concurrent-edit-preserved' public/modules/cfx-post-library/sync-hardening.js
          grep -q 'revisionAtPayload' public/modules/cfx-post-library/sync-hardening.js

      - name: Commit concurrent edit safeguard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-sync-concurrent-edits-once.yml
          git add -A
          git commit -m "Preserve local edits made during GitHub sync"
          git push origin main
