name: Patch normalize-section export

on:
  push:
    paths:
      - .github/workflows/patch-normalize-section.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original layout and add wide section export
        shell: bash
        run: |
          set -euo pipefail
          git show a0b7e05c7cd601c3b251e7a3cc2eb80511309f63:docs/normalize-section/index.html > docs/normalize-section/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("docs/normalize-section/index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"Patch target not found: {label}")
              text = text.replace(old, new, 1)

          # Add the requested export arrangement selector while keeping the original page layout.
          pattern = r'(<div class="control-block export-card"><div class="block-title">4\. 导出设置</div><label>导出内容<select id="exportMode">.*?</select></label>)'
          replacement = r'\1<label>多截面排列方式<select id="sectionLayout"><option value="wide" selected>横向并列（推荐）</option><option value="long">纵向追加（兼容旧格式）</option></select></label>'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Patch target not found: export card")

          replace_once(
              '"downloadBtn","exportMode","chooseFolderBtn"',
              '"downloadBtn","exportMode","sectionLayout","chooseFolderBtn"',
              "sectionLayout id",
          )

          # Styles for two-level grouped headers and blank separator columns.
          replace_once(
              '    th { position: sticky; top: 0; background: #f8fafc; z-index: 1; }\n',
              '''    th { position: sticky; top: 0; background: #f8fafc; z-index: 1; }\n    .data-table-wide thead tr:first-child th { top: 0; }\n    .data-table-wide thead tr:nth-child(2) th { top: 36px; }\n    .section-group-head { height: 36px; text-align: center; color: var(--accent-dark); background: #e8f7f8; border-left: 2px solid #9ed4dc; border-right: 2px solid #9ed4dc; font-weight: 700; }\n    .section-field-head { background: #f6fbfc; }\n    .section-gap { min-width: 18px; width: 18px; padding: 0 !important; border: 0 !important; background: var(--bg) !important; }\n''',
              "wide preview styles",
          )

          # Replace result-preview refreshes after projection/output-option changes.
          preview_call = 'renderPreview(state.projected.slice(0,30),exportHeaders());'
          if text.count(preview_call) < 3:
              raise SystemExit("Unexpected result preview call count")
          text = text.replace(preview_call, 'refreshResultPreview();')

          helper_block = r'''
    function useWideSectionLayout(){return Boolean(els.sectionLayout&&els.sectionLayout.value==="wide"&&state.groups.length>1);}
    function wideBlockHeaders(){const excluded=new Set([els.groupCol.value,"section_id_projected"].filter(Boolean)); return exportHeaders().filter(header=>!excluded.has(header));}
    function groupedProjectedRows(){return state.groups.map(group=>({group,rows:state.projected.filter(row=>String(row.section_id_projected)===String(group))}));}
    function refreshResultPreview(){if(!state.projected.length)return; if(useWideSectionLayout())renderWidePreview(); else renderPreview(state.projected.slice(0,30),exportHeaders());}
    function renderWidePreview(){
      const headers=wideBlockHeaders();
      const groups=groupedProjectedRows();
      if(!headers.length||!groups.length){renderPreview(state.projected.slice(0,30),exportHeaders());return;}
      const maxRows=Math.min(30,Math.max(...groups.map(item=>item.rows.length)));
      const groupHeader=groups.map((item,index)=>`<th class="section-group-head" colspan="${headers.length}">${escapeHtml(item.group)}</th>${index<groups.length-1?'<th class="section-gap" rowspan="2"></th>':''}`).join("");
      const fieldHeader=groups.map(item=>headers.map(header=>`<th class="section-field-head" title="${escapeHtml(item.group)}">${escapeHtml(header)}</th>`).join("")).join("");
      const body=Array.from({length:maxRows},(_,rowIndex)=>`<tr>${groups.map((item,index)=>{const row=item.rows[rowIndex]; const cells=headers.map(header=>`<td>${row?escapeHtml(formatCell(row[header])):''}</td>`).join(""); return cells+(index<groups.length-1?'<td class="section-gap"></td>':'');}).join("")}</tr>`).join("");
      els.preview.innerHTML=`<table class="data-table data-table-wide"><thead><tr>${groupHeader}</tr><tr>${fieldHeader}</tr></thead><tbody>${body}</tbody></table>`;
      queueLayoutSync();
    }
'''

          compact_pattern = r'(    function compactExportHeaders\(\)\{[^\n]+\}\n)'
          text, count = re.subn(compact_pattern, lambda m: m.group(1) + helper_block, text, count=1)
          if count != 1:
              raise SystemExit("Patch target not found: compactExportHeaders")

          old_csv = '    function buildCsvText(){const headers=exportHeaders(); const lines=[headers.map(csvEscape).join(",")]; state.projected.forEach(row=>{lines.push(headers.map(h=>csvEscape(row[h])).join(","));}); return lines.join("\\n");}'
          new_csv = r'''    function buildLongCsvText(){const headers=exportHeaders(); const lines=[headers.map(csvEscape).join(",")]; state.projected.forEach(row=>{lines.push(headers.map(header=>csvEscape(row[header])).join(","));}); return lines.join("\n");}
    function buildWideCsvText(){
      const headers=wideBlockHeaders();
      const groups=groupedProjectedRows();
      if(groups.length<2||!headers.length)return buildLongCsvText();
      const sectionRow=[];
      const headerRow=[];
      groups.forEach((item,index)=>{
        sectionRow.push(item.group,...Array(Math.max(0,headers.length-1)).fill(""));
        headerRow.push(...headers);
        if(index<groups.length-1){sectionRow.push("");headerRow.push("");}
      });
      const lines=[sectionRow.map(csvEscape).join(","),headerRow.map(csvEscape).join(",")];
      const maxRows=Math.max(...groups.map(item=>item.rows.length));
      for(let rowIndex=0;rowIndex<maxRows;rowIndex++){
        const output=[];
        groups.forEach((item,index)=>{
          const row=item.rows[rowIndex];
          headers.forEach(header=>output.push(row?row[header]:""));
          if(index<groups.length-1)output.push("");
        });
        lines.push(output.map(csvEscape).join(","));
      }
      return lines.join("\n");
    }
    function buildCsvText(){return useWideSectionLayout()?buildWideCsvText():buildLongCsvText();}'''
          replace_once(old_csv, new_csv, "CSV builder")

          # Add a UTF-8 BOM so Chinese section names display correctly in Excel.
          replace_once(
              'const blob=new Blob([csvText],{type:"text/csv;charset=utf-8"});',
              'const blob=new Blob(["\\uFEFF",csvText],{type:"text/csv;charset=utf-8"});',
              "CSV BOM",
          )

          export_listener = 'els.exportMode.addEventListener("change",()=>{if(state.projected.length)refreshResultPreview();});'
          replace_once(
              export_listener,
              export_listener+' els.sectionLayout.addEventListener("change",()=>{if(state.projected.length)refreshResultPreview();});',
              "section layout listener",
          )

          # Sanity checks.
          required = [
              'id="sectionLayout"',
              'function buildWideCsvText()',
              'function renderWidePreview()',
              '横向并列（推荐）',
              '纵向追加（兼容旧格式）',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"Missing required marker: {marker}")

          path.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('docs/normalize-section/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*)</script>', html, re.S)
          if not match:
              raise SystemExit('Script block not found')
          Path('/tmp/normalize-section.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/normalize-section.js

      - name: Commit patched page and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-normalize-section.yml
          git add docs/normalize-section/index.html
          git commit -m "横向并列导出多截面数据并恢复原页面布局"
          git push origin HEAD:main
