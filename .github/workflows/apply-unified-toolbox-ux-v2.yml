name: Apply unified toolbox UX v2

on:
  push:
    paths:
      - '.github/workflows/apply-unified-toolbox-ux-v2.yml'
      - 'public/embedded-modules.css'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply non-destructive UX patches
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')

          # Additional icons used by the quick workspace.
          app = app.replace(
              '  CircleDotDashed,\n  Command,',
              '  CircleDotDashed,\n  Clock3,\n  Cloud,\n  Command,',
          )

          # Register module 06 in the real React source instead of injecting a duplicate at runtime.
          if 'id: "cfx-post-library"' not in app:
              module = '''
            {
              id: "cfx-post-library",
              sequence: "06",
              title: "CFX-Post 公式与命令库",
              shortTitle: "公式命令库",
              description: "集中管理 CEL 表达式、CCL 对象、文件夹与加载包，并通过私有 GitHub 数据仓库跨设备同步。",
              category: "数据管理",
              runtime: "browser",
              runtimeLabel: "纯浏览器",
              entry: "modules/cfx-post-library/app.html?v=1.6.1",
              icon: Command,
              tone: "blue",
              features: ["CEL / CCL", "文件夹管理", "GitHub 同步"],
            },
          '''
              marker = '\n];\n\nconst moduleById'
              if marker not in app:
                  raise SystemExit('modules array closing marker not found')
              app = app.replace(marker, module + marker, 1)

          if 'const moduleCategories =' not in app:
              app = app.replace(
                  'const moduleById = new Map(modules.map((module) => [module.id, module]));',
                  'const moduleById = new Map(modules.map((module) => [module.id, module]));\nconst moduleCategories = ["全部", ...Array.from(new Set(modules.map((module) => module.category)))];',
              )

          # Same-origin iframe embedding: add a body class and a layout-only stylesheet.
          if 'function moduleFrameUrl(' not in app:
              helper_marker = '''function moduleUrl(path: string) {
            return new URL(path, document.baseURI).href;
          }
          '''
              helper = '''function moduleUrl(path: string) {
            return new URL(path, document.baseURI).href;
          }

          function moduleFrameUrl(path: string) {
            const url = new URL(path, document.baseURI);
            url.searchParams.set("embedded", "1");
            return url.href;
          }

          function prepareEmbeddedFrame(frame: HTMLIFrameElement, module: ToolModule) {
            try {
              const doc = frame.contentDocument;
              if (!doc?.head || !doc.body) return;
              doc.documentElement.dataset.peltonEmbedded = "true";
              doc.body.classList.add("toolbox-embedded", `toolbox-module-${module.id}`);

              if (!doc.getElementById("pelton-embedded-layout")) {
                const link = doc.createElement("link");
                link.id = "pelton-embedded-layout";
                link.rel = "stylesheet";
                link.href = moduleUrl("embedded-modules.css?v=2.0");
                doc.head.appendChild(link);
              }

              if (module.id === "plane-wizard" && !doc.getElementById("plane-layout-optimization")) {
                const link = doc.createElement("link");
                link.id = "plane-layout-optimization";
                link.rel = "stylesheet";
                link.href = moduleUrl("modules/plane-wizard/layout-optimization.css?v=1.1");
                doc.head.appendChild(link);
              }

              if (module.id !== "cfx-post-library") {
                const title = doc.querySelector("h1") as HTMLElement | null;
                if (title) {
                  title.classList.add("toolbox-inner-title");
                  let node = title.parentElement;
                  const viewportWidth = doc.documentElement.clientWidth || frame.clientWidth;
                  while (node && node !== doc.body) {
                    const rect = node.getBoundingClientRect();
                    if (rect.height >= 72 && rect.width >= Math.min(520, viewportWidth * 0.45)) {
                      node.classList.add("toolbox-inner-hero");
                      break;
                    }
                    node = node.parentElement;
                  }
                }
              }
            } catch {
              // All modules are same-origin in GitHub Pages; keep the original module usable if a browser blocks access.
            }
          }
          '''
              if helper_marker not in app:
                  raise SystemExit('moduleUrl helper marker not found')
              app = app.replace(helper_marker, helper, 1)

          # Preserve the user's explicit sidebar choice instead of auto-collapsing on every module open.
          app = re.sub(
              r'\n  useEffect\(\(\) => \{\n    if \(activeId && window\.matchMedia\("\(min-width: 781px\)"\)\.matches\) \{\n      setSidebarCollapsed\(true\);\n    \}\n  \}, \[activeId\]\);\n',
              '\n',
              app,
              count=1,
          )

          # Homepage category filter and recent-module state.
          app = app.replace(
              '  const [search, setSearch] = useState("");',
              '  const [search, setSearch] = useState("");\n  const [categoryFilter, setCategoryFilter] = useState("全部");\n  const [lastUsedId, setLastUsedId] = useState(() => localStorage.getItem("pelton-toolbox-last") || "");',
          )

          filter_pattern = re.compile(
              r'  const filteredModules = useMemo\(\(\) => \{.*?\n  \}, \[search\]\);',
              re.S,
          )
          filter_replacement = '''  const filteredModules = useMemo(() => {
            const query = search.trim().toLowerCase();
            return modules.filter((module) => {
              const matchesCategory = categoryFilter === "全部" || module.category === categoryFilter;
              if (!matchesCategory) return false;
              if (!query) return true;
              return [
                module.title,
                module.shortTitle,
                module.description,
                module.category,
                module.runtimeLabel,
                ...module.features,
              ]
                .join(" ")
                .toLowerCase()
                .includes(query);
            });
          }, [search, categoryFilter]);'''
          app, count = filter_pattern.subn(filter_replacement, app, count=1)
          if count != 1:
              raise SystemExit('filteredModules block not found')

          app = app.replace(
              '    localStorage.setItem("pelton-toolbox-last", id);\n    window.location.hash = `#/tool/${id}`;',
              '    localStorage.setItem("pelton-toolbox-last", id);\n    setLastUsedId(id);\n    window.location.hash = `#/tool/${id}`;',
          )

          if 'const lastUsedModule =' not in app:
              current_marker = '''  const currentFramePath = activeModule
            ? showHelp && activeModule.help
              ? activeModule.help
              : activeModule.entry
            : "";
          '''
              current_replacement = current_marker + '''
            const lastUsedModule = moduleById.get(lastUsedId) ?? modules[3];
            const githubSyncSummary = (() => {
              try {
                const cfg = JSON.parse(localStorage.getItem("cfxpost_github_sync_config_v1") || "{}");
                if (cfg.lastSyncAt) {
                  return `已同步 · ${new Date(cfg.lastSyncAt).toLocaleString("zh-CN", { hour12: false })}`;
                }
                return cfg.autoSync ? "自动同步已启用" : "尚未配置";
              } catch {
                return "尚未配置";
              }
            })();
          '''
              if current_marker not in app:
                  raise SystemExit('currentFramePath marker not found')
              app = app.replace(current_marker, current_replacement, 1)

          # Dynamic totals.
          app = app.replace('<strong>5</strong> 个功能模块', '<strong>{modules.length}</strong> 个功能模块')
          app = app.replace('<strong>4</strong> 个纯浏览器工具', '<strong>{modules.filter((module) => module.runtime === "browser").length}</strong> 个纯浏览器工具')

          # Add a useful quick workspace between the hero and the module grid.
          quick_marker = '''            </section>

            <section className="tool-section">'''
          if 'className="quick-workspace"' not in app:
              quick = '''            </section>

            <section className="quick-workspace" aria-label="快捷工作区">
              <button className="quick-card" onClick={() => openModule(lastUsedModule.id)}>
                <span className="quick-icon tone-cyan"><Clock3 size={18} /></span>
                <span className="quick-copy"><small>最近使用</small><strong>{lastUsedModule.shortTitle}</strong><span>{lastUsedModule.category}</span></span>
              </button>
              <button className="quick-card" onClick={() => openModule("cfx-post-library")}>
                <span className="quick-icon tone-blue"><Command size={18} /></span>
                <span className="quick-copy"><small>常用数据工具</small><strong>公式与命令库</strong><span>CEL / CCL 集中管理</span></span>
              </button>
              <button className="quick-card" onClick={() => openModule("cfx-post-library")}>
                <span className="quick-icon tone-green"><Cloud size={18} /></span>
                <span className="quick-copy"><small>GitHub 数据</small><strong>{githubSyncSummary}</strong><span>私有仓库同步状态</span></span>
              </button>
              <button className="quick-card" onClick={() => openModule("def-converter")}>
                <span className="quick-icon tone-orange"><HardDrive size={18} /></span>
                <span className="quick-copy"><small>本地服务</small><strong>按需启动</strong><span>CFX 批量转 DEF</span></span>
              </button>
            </section>

            <section className="tool-section">'''
              if quick_marker not in app:
                  raise SystemExit('quick workspace insertion marker not found')
              app = app.replace(quick_marker, quick, 1)

          # Add category filter buttons while retaining the existing search box.
          filter_row_marker = '''                </label>
              </div>

              {filteredModules.length ? ('''
          if 'className="category-filter"' not in app:
              filter_row = '''                </label>
              </div>
              <div className="category-filter" aria-label="模块分类筛选">
                {moduleCategories.map((category) => (
                  <button
                    key={category}
                    className={categoryFilter === category ? "active" : ""}
                    onClick={() => setCategoryFilter(category)}
                  >
                    {category}
                  </button>
                ))}
              </div>

              {filteredModules.length ? ('''
              if filter_row_marker not in app:
                  raise SystemExit('category filter insertion marker not found')
              app = app.replace(filter_row_marker, filter_row, 1)

          app = app.replace('<Icon size={25} strokeWidth={1.8} />', '<Icon size={29} strokeWidth={1.8} />')

          # Embed modules with the unified stylesheet; independent-open URLs remain unchanged.
          app = app.replace(
              '                src={moduleUrl(currentFramePath)}\n                loading="eager"',
              '                src={showHelp ? moduleUrl(currentFramePath) : moduleFrameUrl(currentFramePath)}\n                onLoad={(event) => {\n                  if (!showHelp && activeModule) prepareEmbeddedFrame(event.currentTarget, activeModule);\n                }}\n                loading="eager"',
          )

          app_path.write_text(app, encoding='utf-8')

          # Append shell-level layout overrides. They do not remove or recreate controls.
          styles_path = Path('src/styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          marker = '/* Unified toolbox UX v2 */'
          if marker not in styles:
              styles += r'''

          /* Unified toolbox UX v2 */
          html,
          body,
          #root {
            height: 100%;
            min-height: 0;
            overflow: hidden;
          }

          .app-shell {
            height: 100vh;
            min-height: 0;
            overflow: hidden;
          }

          .main-area {
            height: 100vh;
            min-height: 0;
            display: flex;
            flex-direction: column;
          }

          .topbar {
            position: relative;
            flex: 0 0 var(--topbar-height);
          }

          .home-view {
            width: min(1320px, calc(100% - 44px));
            max-width: none;
            flex: 1 1 auto;
            overflow: auto;
            scrollbar-gutter: stable;
            padding: 24px 0 38px;
          }

          .hero-panel {
            min-height: 210px;
            padding: 28px 36px;
          }

          .hero-copy h1 {
            margin: 12px 0 9px;
            font-size: clamp(28px, 2.6vw, 38px);
          }

          .hero-copy > p {
            line-height: 1.7;
          }

          .hero-meta {
            margin-top: 18px;
          }

          .hero-visual {
            width: 154px;
            height: 154px;
            flex-basis: 154px;
          }

          .visual-center {
            inset: 53px;
          }

          .quick-workspace {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
          }

          .quick-card {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 12px 13px;
            color: var(--navy-900);
            text-align: left;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #dbe3ea;
            border-radius: 11px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
          }

          .quick-card:hover {
            transform: translateY(-1px);
            border-color: #b9c9d5;
            box-shadow: 0 8px 20px rgb(15 35 52 / 8%);
          }

          .quick-icon {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            display: grid;
            place-items: center;
            color: var(--accent);
            background: rgb(var(--accent-rgb) / 9%);
            border: 1px solid rgb(var(--accent-rgb) / 13%);
            border-radius: 9px;
          }

          .quick-copy {
            min-width: 0;
            display: grid;
            gap: 2px;
          }

          .quick-copy small,
          .quick-copy span {
            overflow: hidden;
            color: var(--slate-500);
            font-size: 9px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .quick-copy strong {
            overflow: hidden;
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .tool-section {
            margin-top: 22px;
          }

          .section-heading {
            margin-bottom: 10px;
          }

          .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 14px;
          }

          .category-filter button {
            height: 30px;
            padding: 0 11px;
            color: var(--slate-600);
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid #d7e0e7;
            border-radius: 999px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 650;
          }

          .category-filter button:hover,
          .category-filter button.active {
            color: #0f6f68;
            background: #edf8f6;
            border-color: #a9d7d2;
          }

          .tool-card {
            min-height: 260px;
            padding: 18px;
          }

          .card-icon {
            width: 52px;
            height: 52px;
            margin: 15px 0 13px;
          }

          .card-body h3 {
            font-size: 17px;
          }

          .card-body p {
            display: -webkit-box;
            min-height: 38px;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }

          .workspace-view {
            min-height: 0;
            height: auto;
            flex: 1 1 auto;
            overflow: hidden;
            padding: 12px 16px 16px;
          }

          .workspace-heading {
            flex: 0 0 auto;
            margin-bottom: 9px;
          }

          .workspace-title p {
            margin-top: 2px;
          }

          .local-service-notice {
            flex: 0 0 auto;
            min-height: 44px;
            margin-bottom: 8px;
            padding: 7px 10px;
          }

          .local-service-copy {
            display: flex;
            align-items: center;
            gap: 8px;
          }

          .frame-shell {
            min-height: 0;
            height: auto;
            flex: 1 1 auto;
          }

          .frame-shell iframe {
            min-height: 0;
            height: 100%;
          }

          @media (max-width: 1180px) {
            .quick-workspace {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }

          @media (max-width: 780px) {
            html,
            body,
            #root {
              height: auto;
              min-height: 100%;
              overflow: auto;
            }

            .app-shell,
            .main-area {
              height: auto;
              min-height: 100vh;
              overflow: visible;
            }

            .home-view {
              width: min(100% - 24px, 680px);
              overflow: visible;
            }

            .quick-workspace {
              grid-template-columns: 1fr;
            }

            .hero-panel {
              min-height: 0;
              padding: 24px;
            }

            .workspace-view {
              min-height: calc(100vh - var(--topbar-height));
              overflow: visible;
            }

            .frame-shell {
              min-height: 720px;
            }
          }
          '''
              styles_path.write_text(styles, encoding='utf-8')

          # Remove the old DOM-injection script now that module 06 and iframe handling live in React source.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('    <script src="./toolbox-enhancements.js" defer></script>\n', '')
          index_path.write_text(index, encoding='utf-8')

          # Keep the visible command-library version aligned with its actual app version.
          markup_path = Path('public/modules/cfx-post-library/markup-1.js')
          markup = markup_path.read_text(encoding='utf-8').replace('v1.6.0', 'v1.6.1')
          markup_path.write_text(markup, encoding='utf-8')

      - name: Validate application
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css index.html public/modules/cfx-post-library/markup-1.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Unify toolbox shell and embedded module layouts"
            git push
          fi
