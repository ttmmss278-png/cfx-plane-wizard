name: One-time harden CFX GitHub sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-cfx-sync-v180-once.yml

permissions:
  contents: write

jobs:
  upgrade-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install hardened sync module
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64
          import gzip
          import re
          from pathlib import Path

          PAYLOAD = ""

          root = Path('public/modules/cfx-post-library')
          target = root / 'sync-hardening.js'
          target.write_bytes(gzip.decompress(base64.b64decode(PAYLOAD)))

          app_path = root / 'app.html'
          app = app_path.read_text(encoding='utf-8')
          app = app.replace('v=1.7.1', 'v=1.8.0')
          needle = '<script src="token-memory-option.js?v=1.8.0" defer></script>\n'
          hardening = '<script src="sync-hardening.js?v=1.8.0" defer></script>\n'
          if hardening not in app:
              if needle not in app:
                  raise RuntimeError('Unable to locate token-memory script insertion point')
              app = app.replace(needle, needle + hardening)
          app_path.write_text(app, encoding='utf-8')

          version_path = root / 'version-ui.js'
          version_text = version_path.read_text(encoding='utf-8').replace('v1.7.1', 'v1.8.0')
          version_path.write_text(version_text, encoding='utf-8')

          core_path = root / 'core-1.js'
          core_text = core_path.read_text(encoding='utf-8')
          core_text, changed = re.subn(r"const APP_VERSION='[^']+';", "const APP_VERSION='1.8.0';", core_text, count=1)
          if changed != 1:
              raise RuntimeError('Unable to update APP_VERSION')
          core_path.write_text(core_text, encoding='utf-8')

          cache_path = root / 'storage-sync-cache.js'
          cache_text = cache_path.read_text(encoding='utf-8').replace("appVersion:'1.7.0'", "appVersion:'1.8.0'")
          cache_path.write_text(cache_text, encoding='utf-8')

          if app.count('sync-hardening.js') != 1:
              raise RuntimeError('sync-hardening.js must be loaded exactly once')
          PYCODE

          node --check public/modules/cfx-post-library/sync-hardening.js
          grep -q 'sync-hardening.js?v=1.8.0' public/modules/cfx-post-library/app.html
          grep -q "const APP_VERSION='1.8.0';" public/modules/cfx-post-library/core-1.js

      - name: Commit upgraded sync implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/upgrade-cfx-sync-v180-once.yml
          git add -A
          git commit -m "Harden GitHub three-way sync and SHA retry"
          git push origin main
