name: Apply plane wizard layout and register command library

on:
  push:
    paths:
      - '.github/workflows/apply-plane-wizard-layout.yml'
      - 'public/modules/plane-wizard/layout-optimization.css'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply non-destructive source patches
        shell: python
        run: |
          from pathlib import Path

          # 1) Attach the visual-only stylesheet to module 04.
          plane = Path('public/modules/plane-wizard/index.html')
          text = plane.read_text(encoding='utf-8')
          css_tag = '    <link rel="stylesheet" href="./layout-optimization.css?v=1.1" />\n'
          if 'layout-optimization.css' not in text:
              if '</head>' not in text:
                  raise SystemExit('plane-wizard index.html has no </head> marker')
              text = text.replace('</head>', css_tag + '  </head>', 1)
              plane.write_text(text, encoding='utf-8')

          # 2) Register the CFX-Post library as module 06.
          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          if 'id: "cfx-post-library"' not in text:
              marker = '\n];\n\nconst moduleById'
              module = '''
  {
    id: "cfx-post-library",
    sequence: "06",
    title: "CFX-Post 公式与命令库",
    shortTitle: "公式命令库",
    description: "集中管理 CEL 表达式、CCL 对象、文件夹与加载包，并通过私有 GitHub 数据仓库跨设备同步。",
    category: "后处理",
    runtime: "browser",
    runtimeLabel: "纯浏览器",
    entry: "modules/cfx-post-library/index.html",
    icon: Command,
    tone: "blue",
    features: ["CEL / CCL", "文件夹管理", "GitHub 同步"],
  },
'''
              if marker not in text:
                  raise SystemExit('modules array closing marker not found')
              text = text.replace(marker, module + marker, 1)

          # 3) Update the homepage totals only; layout and existing modules remain unchanged.
          text = text.replace('<strong>5</strong> 个功能模块', '<strong>6</strong> 个功能模块')
          text = text.replace('<strong>4</strong> 个纯浏览器工具', '<strong>5</strong> 个纯浏览器工具')
          app.write_text(text, encoding='utf-8')

      - name: Validate source changes
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/plane-wizard/index.html src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Optimize plane wizard layout and add CFX-Post library module"
            git push
          fi
